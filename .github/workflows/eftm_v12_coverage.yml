name: EFTM v1.2 coverage source audit

on:
  push:
    branches: [eftm-strict-open-20260822]
    paths:
      - '.github/workflows/eftm_v12_coverage.yml'
      - 'eftm_v12/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests pandas openpyxl
      - name: Audit open timing and SEC sources
        run: |
          mkdir -p eftm_v12_out
          python - <<'PY'
          import json, re, time, zipfile, io, os
          from pathlib import Path
          import requests, pandas as pd
          from zoneinfo import ZoneInfo
          from datetime import datetime

          OUT=Path('eftm_v12_out')
          TARGETS=['AMD','AAPL','MSFT','NVDA','AVGO']
          S=requests.Session()
          S.headers.update({'User-Agent':'EFTM academic research contact research@example.com'})
          audit={'figshare':{},'sec':{},'targets':TARGETS}

          # ---- PLOS Figshare collection ----
          coll=3703099
          u=f'https://api.figshare.com/v2/collections/{coll}/articles?page_size=1000'
          r=S.get(u,timeout=60); audit['figshare']['collection_status']=r.status_code
          articles=[]
          if r.ok:
              articles=r.json(); audit['figshare']['article_count']=len(articles); audit['figshare']['articles']=articles
          details=[]; downloaded=[]
          for a in articles:
              aid=a.get('id')
              rr=S.get(f'https://api.figshare.com/v2/articles/{aid}',timeout=60)
              if not rr.ok: continue
              d=rr.json()
              keep={k:d.get(k) for k in ['id','title','doi','description','license','defined_type_name','published_date','modified_date','url_private_api','url_public_api']}
              keep['files']=d.get('files',[])
              details.append(keep)
              for f in d.get('files',[]):
                  name=f.get('name','')
                  furl=f.get('download_url')
                  if not furl: continue
                  # Download modest data/metadata files; skip huge tweet archives.
                  size=f.get('size') or 0
                  if size <= 50_000_000 or any(x in name.lower() for x in ['earn','event','announcement','ea','market']):
                      try:
                          fr=S.get(furl,timeout=120)
                          if fr.ok:
                              p=OUT/('figshare_'+str(aid)+'_'+re.sub(r'[^A-Za-z0-9._-]+','_',name))
                              p.write_bytes(fr.content)
                              downloaded.append({'article_id':aid,'name':name,'size':len(fr.content),'path':str(p)})
                      except Exception as e:
                          downloaded.append({'article_id':aid,'name':name,'error':repr(e)})
          audit['figshare']['details']=details
          audit['figshare']['downloaded']=downloaded

          # Attempt legacy ID in Data Availability statement.
          for aid in [4036269]:
              rr=S.get(f'https://api.figshare.com/v2/articles/{aid}',timeout=60)
              audit['figshare'][f'legacy_{aid}_status']=rr.status_code
              if rr.ok: audit['figshare'][f'legacy_{aid}']=rr.json()

          # Inspect downloaded tabular/text files for target tickers and timing strings.
          scans=[]
          for item in downloaded:
              if 'path' not in item: continue
              p=Path(item['path']); rec={'path':str(p),'name':p.name,'target_hits':{},'timing_hits':{}}
              try:
                  if p.suffix.lower()=='.csv':
                      df=pd.read_csv(p,low_memory=False)
                      rec['columns']=list(map(str,df.columns)); rec['rows']=len(df)
                      txt=df.astype(str)
                      for t in TARGETS:
                          mask=txt.apply(lambda c:c.str.upper().eq(t)).any(axis=1)
                          if mask.any(): rec['target_hits'][t]=df[mask].head(50).astype(str).to_dict('records')
                      for token in ['BeforeOpen','AfterClose','before','after','BMO','AMC']:
                          mask=txt.apply(lambda c:c.str.contains(token,case=False,na=False,regex=False)).any(axis=1)
                          if mask.any(): rec['timing_hits'][token]=int(mask.sum())
                  elif p.suffix.lower() in ['.xlsx','.xls']:
                      xls=pd.ExcelFile(p)
                      rec['sheets']=xls.sheet_names
                      for sh in xls.sheet_names:
                          df=pd.read_excel(p,sheet_name=sh)
                          txt=df.astype(str)
                          for t in TARGETS:
                              mask=txt.apply(lambda c:c.str.upper().eq(t)).any(axis=1)
                              if mask.any(): rec['target_hits'].setdefault(t,[]).extend(df[mask].head(50).astype(str).to_dict('records'))
                  elif p.suffix.lower() in ['.txt','.tsv','.dat']:
                      text=p.read_text(errors='ignore')
                      for t in TARGETS:
                          if t in text.upper(): rec['target_hits'][t]=text[:20000]
                      rec['timing_hits']={x:len(re.findall(x,text,re.I)) for x in ['BeforeOpen','AfterClose','BMO','AMC']}
              except Exception as e:
                  rec['scan_error']=repr(e)
              scans.append(rec)
          audit['figshare']['scans']=scans

          # ---- SEC submissions / 8-K Item 2.02 ----
          sec_headers={'User-Agent':'EFTM academic research contact research@example.com','Accept-Encoding':'gzip, deflate'}
          tick=S.get('https://www.sec.gov/files/company_tickers.json',headers=sec_headers,timeout=60).json()
          ticker_map={v['ticker'].upper():str(v['cik_str']).zfill(10) for v in tick.values()}
          sec_rows=[]
          for ticker in TARGETS:
              cik=ticker_map[ticker]
              sub=S.get(f'https://data.sec.gov/submissions/CIK{cik}.json',headers=sec_headers,timeout=60).json()
              filing_sets=[sub.get('filings',{}).get('recent',{})]
              for fref in sub.get('filings',{}).get('files',[]):
                  name=fref.get('name')
                  if name:
                      try:
                          js=S.get('https://data.sec.gov/submissions/'+name,headers=sec_headers,timeout=60).json()
                          filing_sets.append(js)
                      except Exception: pass
                  time.sleep(.12)
              for fs in filing_sets:
                  n=max([len(v) for v in fs.values() if isinstance(v,list)] or [0])
                  for i in range(n):
                      def g(k):
                          v=fs.get(k,[]); return v[i] if isinstance(v,list) and i<len(v) else None
                      if g('form')!='8-K': continue
                      items=str(g('items') or '')
                      if '2.02' not in items: continue
                      adt=g('acceptanceDateTime')
                      cls='unknown'
                      if adt:
                          try:
                              dt=datetime.fromisoformat(str(adt).replace('Z','+00:00'))
                              # SEC acceptance timestamps are retained verbatim; classification is proxy only.
                              h=dt.hour+dt.minute/60
                              cls='sec_pre_market_proxy' if h<9.5 else ('sec_after_close_proxy' if h>=16 else 'sec_intraday_proxy')
                          except Exception: pass
                      sec_rows.append({'ticker':ticker,'cik':cik,'accessionNumber':g('accessionNumber'),'filingDate':g('filingDate'),'reportDate':g('reportDate'),'acceptanceDateTime':adt,'items':items,'primaryDocument':g('primaryDocument'),'proxy_class':cls})
              time.sleep(.15)
          sdf=pd.DataFrame(sec_rows).drop_duplicates(['ticker','accessionNumber']).sort_values(['ticker','filingDate']) if sec_rows else pd.DataFrame()
          if len(sdf): sdf.to_csv(OUT/'sec_8k_item_202_timing_proxy.csv',index=False)
          audit['sec']['counts']=sdf.groupby('ticker').size().to_dict() if len(sdf) else {}
          audit['sec']['proxy_counts']=sdf.groupby(['ticker','proxy_class']).size().unstack(fill_value=0).to_dict('index') if len(sdf) else {}
          audit['sec']['rows']=sdf.astype(str).to_dict('records') if len(sdf) else []

          (OUT/'SOURCE_AUDIT.json').write_text(json.dumps(audit,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({'figshare_article_count':audit['figshare'].get('article_count'), 'downloads':downloaded, 'sec_counts':audit['sec'].get('counts'), 'sec_proxy_counts':audit['sec'].get('proxy_counts')},indent=2))
          PY
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: eftm-v12-coverage-source-audit
          retention-days: 3
          compression-level: 9
          path: eftm_v12_out/**
