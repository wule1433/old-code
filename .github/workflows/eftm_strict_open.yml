name: EFTM strict-open corrected build

on:
  push:
    branches: [eftm-strict-open-20260822]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DOWNLOAD_TIMEOUT: '1800'
      HF_HUB_ETAG_TIMEOUT: '120'
      HF_XET_HIGH_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'huggingface_hub[hf_xet]>=0.34' pandas numpy pyarrow
      - name: Restore original builder and apply data-semantics adapter
        run: |
          base64 -d eftm_strict_open/build_strict_open_dataset.py.gz.b64 | gzip -d > eftm_strict_open/build_strict_open_dataset.py
          python eftm_strict_open/patch_builder_v2.py
          python -m py_compile eftm_strict_open/fetch_strict_open_sources.py eftm_strict_open/build_strict_open_dataset.py
      - name: Fetch CC-BY-4.0 sources
        run: |
          mkdir -p "$GITHUB_WORKSPACE/eftm_run/qa"
          python eftm_strict_open/fetch_strict_open_sources.py --root "$GITHUB_WORKSPACE/eftm_run"
      - name: Build corrected strict-open model input
        run: python eftm_strict_open/build_strict_open_dataset.py --root "$GITHUB_WORKSPACE/eftm_run"
      - name: Enforce pre-training data gates
        run: |
          python - <<'PY'
          import json,sys
          q=json.load(open('eftm_run/qa/STRICT_OPEN_DATA_QUALITY.json'))
          print(json.dumps(q,indent=2))
          gates={
            'events_ge_3000': q['rows']>=3000,
            'amd_present': q['amd_rows']>0,
            'semiconductors_present': len(q['semiconductor_counts'])>0,
            'revenue_actual_or_margin_present': max(q['feature_nonnull_rates']['revenueAct_YoY'],q['feature_nonnull_rates']['netProfitMargin'],q['feature_nonnull_rates']['netProfitMargin_ttm_y'])>0,
            'no_unknown_license_mirror': not q['license_unknown_earnings_mirror_used'],
            'no_duplicate_events': q['duplicates_symbol_earnReportedDate']==0 and q['duplicates_symbol_amcEquivalentDate']==0,
          }
          print('GATES',json.dumps(gates,indent=2))
          open('eftm_run/qa/PRETRAIN_GATES.json','w').write(json.dumps(gates,indent=2))
          if not all(gates.values()): sys.exit(2)
          PY
      - name: Upload compact build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eftm-strict-open-corrected-built-data
          retention-days: 3
          compression-level: 6
          path: |
            eftm_run/earnings_dataset_v1.1_strict_open.csv
            eftm_run/SOURCE_LICENSE_MANIFEST.runtime.json
            eftm_run/qa/STRICT_OPEN_DATA_QUALITY.json
            eftm_run/qa/PRETRAIN_GATES.json
